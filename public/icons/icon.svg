<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Shield Base -->
  <path d="M256 80 L380 130 C380 280 256 390 256 420 C256 390 132 280 132 130 Z" 
        fill="url(#shield)" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- City / Building Silhouette inside Shield -->
  <path d="M185 240 L185 170 L225 170 L225 145 L285 145 L285 185 L325 185 L325 240 Z" 
        fill="#ffffff" 
        fill-opacity="0.35" />

  <!-- Checkmark -->
  <path d="M190 255 L235 305 L325 205" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#shadow)" />
</svg>
